[theme]
primaryColor = "#6d8cff"
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap, Inter, sans-serif"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&display=swap, monospace"
baseRadius = "0.65rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#3b5bdb"
backgroundColor = "#f4f5f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f1320"
borderColor = "#e4e7ee"

[theme.dark]
primaryColor = "#7c9cff"
backgroundColor = "#07090d"
secondaryBackgroundColor = "#0e1117"
textColor = "#eceef3"
borderColor = "#1e2330"

[client]
toolbarMode = "viewer"

[server]
runOnSave = true
enableStaticServing = true   # serves static/feed/*.json: live chart updates when the app is opened online
