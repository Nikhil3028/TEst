[theme]
primaryColor = "#4c84f5"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
baseRadius = "0.6rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#2f6be0"
backgroundColor = "#f5f6f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#141821"
borderColor = "#e3e6eb"

[theme.dark]
primaryColor = "#6b9bff"
backgroundColor = "#0b0d11"
secondaryBackgroundColor = "#12151b"
textColor = "#e7e9ee"
borderColor = "#232834"

[client]
toolbarMode = "viewer"

[server]
runOnSave = true
enableStaticServing = true   # serves static/feed/*.json: live chart updates when the app is opened online
